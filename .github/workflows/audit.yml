name: Audit
# The audit configuration itself (.cargo/audit.toml, deny.toml, this file) is
# in the path filter too: editing an ignore list without re-running the audit
# leaves the change unverified until the next Monday cron. workflow_dispatch
# allows the same check on demand.
on:
  push:
    paths: ["**/Cargo.toml", "**/Cargo.lock", "deny.toml", ".cargo/audit.toml", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "**/Cargo.lock", "deny.toml", ".cargo/audit.toml", ".github/workflows/audit.yml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # rustsec/audit-check publishes results as a check run.
  checks: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action shells out to `cargo audit` in the checkout root, so
      # .cargo/audit.toml is picked up on its own -- the ignore list lives
      # there only (all of it informational advisories in transitive Tauri/GTK
      # deps, see that file for the per-entry rationale). Passing the ids again
      # through the action's `ignore:` input would just duplicate them in the
      # audit settings and leave two lists to keep in sync.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Enforce the dependency license policy (deny.toml): a dependency update that
  # pulls in a copyleft crate fails here instead of shipping in a binary release.
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-deny
      - run: cargo deny check licenses
